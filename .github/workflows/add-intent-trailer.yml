name: Add latest Spiral Intent trailer
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch landing with latest trailer
        env:
          VIDEO_URL: 'https://files2.heygen.ai/aws_pacific/avatar_tmp/3cd06493eb4646a8adce5ed7a9597c8e/v17f2b2e89ee94f7da8b221cbb33e1557/f34ef713939c479aa2049dc41ccdb587.mp4?Expires=1789177150&Signature=iXV6t015sYkH8pRKoRQtFjCR9FT~fbrPbQDz9FzbtjoukXUgWmowQlKteNpqtuiLjLRhEwXZHEaYYKtaf0eMtz9DaUqZQazdneR6-Dl9tsUB4hG-KgZSdlErQhiVMoZpFKuPIuralCdVsRyuBqLkJr3p5Eww~Mbo-mRRkJK-zwlU3kXMib8WnjE78cI2AqMzDsjMsTeCBPBH30htRHbpgA0vYPx7X42OjsZhYfwleFxfd1UWZHdfYYHooqnNZpqbWVrXofgRq3RVPI0g~LxE7~rCb4fuTcxG42-rjb3vCs0gbRyhRHeK0Lpo5h726IW1MtEBtCpefgT87Dr8i32FTQ__&Key-Pair-Id=K38HBHX5LX3X2H'
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          p = Path('index.html')
          s = p.read_text()
          marker = '<section id="video"><div class="video-grid">'
          if 'id="intent-trailer-2026"' in s:
              print('Latest trailer already present; nothing to do.')
              raise SystemExit(0)
          insert = '''<section id="intent-trailer-2026" style="border-top:1px solid #111923"><div class="video-grid"><div><div class="eyebrow">SPIRAL INTENT · CINEMATIC TRAILER</div><h2>Prove what actually happened.</h2><p class="sub">A new cinematic introduction to independent execution assurance.</p></div><div class="video-frame"><video controls playsinline preload="metadata" src="%s"></video></div></div></section>''' % os.environ['VIDEO_URL']
          if marker not in s:
              raise SystemExit('video marker not found')
          s = s.replace(marker, insert + marker, 1)
          p.write_text(s)
          PY
      - name: Commit landing patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: add new Spiral Intent cinematic trailer [skip ci]'
          git push