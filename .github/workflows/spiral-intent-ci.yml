name: Spiral Intent CI
on:
  push:
    branches: [main, intent-lead-recovery]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test -- --runInBand
      - run: npm run build
      - run: npm run typecheck
