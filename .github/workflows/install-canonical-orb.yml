name: Install canonical Orb

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install-orb:
    if: hashFiles('portfolio/.orb-parts/COMPLETE') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble canonical Orb
        shell: bash
        run: |
          set -euo pipefail
          rm -f portfolio/index.html
          for f in portfolio/.orb-parts/part-*.txt; do
            cat "$f" >> portfolio/index.html
          done
          test "$(sha256sum portfolio/index.html | cut -d' ' -f1)" = "7c291f2e7f2de558f9ece6cfab8e2f123e3e687651f1592a0fc28f31ee2ac1bd"
          rm -rf portfolio/.orb-parts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/index.html portfolio/.orb-parts
          git commit -m "Publish canonical Spiral Orb to portfolio"
          git push
