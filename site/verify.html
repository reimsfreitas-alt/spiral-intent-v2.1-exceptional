<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spiral Intent — Verify Receipt</title><style>body{margin:0;background:#05070a;color:#e7edf3;font:16px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto;padding:65px 24px}.mono{font-family:monospace;color:#c9a227}textarea{width:100%;min-height:260px;background:#080c12;color:#dce5ee;border:1px solid #1c2633;border-radius:8px;padding:15px;font:12px monospace}button{margin-top:12px;padding:11px 16px;background:#c9a227;border:0;border-radius:7px;cursor:pointer}.box{margin-top:20px;padding:18px;border:1px solid #1c2633;border-radius:8px}.ok{color:#57d98e}.bad{color:#f0655e}a{color:#c9a227}</style></head><body><main><div class="mono">SPIRAL INTENT / OFFLINE RECEIPT VERIFIER</div><h1>Verify a receipt yourself.</h1><p>The receipt carries the verifier public key. This page checks the Ed25519 signature and independently recomputes the evidence hash. No shared secret is required.</p><textarea id="r" placeholder="Paste a Spiral Intent receipt JSON here"></textarea><button id="v">VERIFY</button><div id="out"></div><p><a href="/">← Back to Spiral Intent</a></p></main><script>
const enc=new TextEncoder();const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));function canon(v){if(v===undefined)throw Error('undefined');if(v===null||typeof v!=='object')return JSON.stringify(v);if(Array.isArray(v))return '['+v.map(canon).join(',')+']';return '{'+Object.keys(v).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}'}async function sha(v){const d=await crypto.subtle.digest('SHA-256',enc.encode(typeof v==='string'?v:canon(v)));return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function verify(){const out=document.getElementById('out');try{const d=JSON.parse(document.getElementById('r').value);if(!d.signature||!d.verifier_public_key_b64)throw Error('Receipt needs signature and verifier_public_key_b64');const {signature,verifier_public_key_b64,...body}=d;const key=await crypto.subtle.importKey('raw',b64(verifier_public_key_b64),{name:'Ed25519'},false,['verify']);const sig=await crypto.subtle.verify({name:'Ed25519'},key,b64(signature),enc.encode(canon(body)));if(!sig)throw Error('RECEIPT_SIGNATURE_INVALID');const evidence=await sha({intent_hash:body.intent_hash,authorization_id:body.authorization_id,execution_id:body.execution_id,claimed_effect:body.claimed_effect,observed_effect:body.observed_effect,verdict:body.verdict});if(evidence!==body.evidence_hash)throw Error('EVIDENCE_HASH_MISMATCH');out.innerHTML='<div class="box"><b class="ok mono">VALID · '+body.verdict+'</b><p>Signature and evidence hash verified locally in this browser.</p></div>'}catch(e){out.innerHTML='<div class="box"><b class="bad mono">NOT VERIFIED</b><p>'+String(e.message||e)+'</p></div>'}}document.getElementById('v').onclick=verify;</script></body></html>
